name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  method:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-core.txt
      - run: python -m pytest
      - run: python scripts/verify_snapshot.py
